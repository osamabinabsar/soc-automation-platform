title: Encoded PowerShell command execution
id: a8c2e6f0-4b33-4d95-9a1e-5d7b0c8e1106
logsource: windows-powershell
description: PowerShell invoked with an encoded command (-enc / -EncodedCommand)
  - a staple of Windows intrusion chains and living-off-the-land activity.
level: high
mitre: T1059.001
detection:
  selection:
    event_type: windows_event
    provider|contains: PowerShell
    command|re: '(?i)(-e(nc|ncodedcommand)?\s+[A-Za-z0-9+/=]{20,})'
  condition: selection
